<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Elements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .nav-item:hover {
            background-color: #ffc107;
        }
    </style>
</head>
<body class="container">
    <!-- semantic elements -->
    <header class="bg-primary text-white text-center border rounded shadow p-5 my-4">
        <h1>Semantic Elements</h1>
    </header>

    <nav class=" bg-light border rounded p-3 my-4">
        <h2 class="text-warning-emphasis border-bottom pb-3">Nav Area</h2>
        <ul class="nav gap-2">
            <li class="nav-item border border-dark rounded px-3 py-1 bg-white">
                <a href="#" class="text-decoration-none text-dark">Home</a>
            </li>
            <li class="nav-item border border-dark rounded px-3 py-1 bg-white">
                <a href="#" class="text-decoration-none text-dark">About</a>
            </li>
            <li class="nav-item border border-dark rounded px-3 py-1 bg-white">
                <a href="#" class="text-decoration-none text-dark">Contact</a>
            </li>
        </ul>
    </nav>

    <main class="bg-success text-white border rounded shadow p-4 my-4">
        <div class="row">
            <section class="col-sm-8">
                 <h3>Section 1</h3>
                 <p>This is the first section of the main content.</p>
            </section>

            <aside class="col-sm-4 border-start">
                <h3>Aside</h3>
                <p>This is the content of the aside section.</p>
            </aside>
        </div>
    </main>

    

    <footer class="bg-secondary text-white text-center border rounded shadow p-3 my-4">
        <h6>Footer Area</h6>
        <p>This is the footer content.</p>
    </footer>
</body>
</html>
